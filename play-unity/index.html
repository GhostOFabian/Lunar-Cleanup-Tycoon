<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lunar Cleanup Tycoon – Unity-Version (Beta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#070a12;--panel:#111827;--ink:#e8eefc;--dim:#93a0b8;--credit:#ffc24b;--line:#263247}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-family:Oxanium,sans-serif;font-weight:700;letter-spacing:.03em}
header a span{color:var(--credit)}
header .b{display:flex;gap:8px}
header button,header .btn{font:inherit;font-size:.9rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none}
main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
#frame{position:relative;height:100%;max-height:960px;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{width:100%;height:100%;display:block;background:#000}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#load b{font-family:Oxanium,sans-serif;font-size:1.3rem}
#bar{width:70%;height:10px;border-radius:6px;background:#1c2535;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--credit);transition:width .2s}
#load small{color:var(--dim);max-width:34ch;line-height:1.45}
#err{color:#ff8a8a}
footer{color:var(--dim);font-size:.8rem;padding:6px 16px 10px;text-align:center}
body.m header,body.m footer{display:none}body.m main{padding:0}body.m #frame{border:0;border-radius:0;height:100%;width:100%;max-height:none;aspect-ratio:auto}
#fbBtn{display:none}
#fbBox{position:fixed;inset:0;background:rgba(3,6,12,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#fbBox .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
#fbBox h3{margin:0 0 6px;font-family:Oxanium,sans-serif}
#fbBox p{margin:0 0 12px;color:var(--dim);font-size:.92rem;line-height:1.4}
#fbBox .thumbs{display:flex;gap:10px;margin-bottom:12px}
#fbBox .thumbs button{flex:1;font-size:1.6rem;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--ink);cursor:pointer}
#fbBox .thumbs button.on{border-color:var(--credit);background:#2a2210}
#fbBox textarea{width:100%;min-height:110px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--ink);font:inherit;padding:10px}
#fbBox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#fbBox .row button{font:inherit;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:#0b1220;color:var(--ink)}
#fbBox .row button.send{background:var(--credit);color:#1a1300;border-color:var(--credit);font-weight:700}
#fbBox .row button:disabled{opacity:.45;cursor:default}
#fbMsg{color:var(--dim);font-size:.85rem;margin-top:8px;min-height:1.2em}
#fbFloat{display:none;position:fixed;right:6px;top:50%;transform:translateY(-50%);z-index:40;background:rgba(17,24,39,.72);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-size:1.1rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <a href="../index.html">Lunar Cleanup <span>Tycoon</span></a>
  <div class="b"><button id="fbBtn" type="button">Feedback</button><button id="fs" type="button">Vollbild</button></div>
</header>
<main><div id="frame">
  <canvas id="c" tabindex="-1"></canvas>
  <div id="load"><b id="loadT">Unity-Version wird geladen …</b><div id="bar"><i></i></div><small id="loadH">Einmalig rund 28 MB, danach aus dem Browser-Speicher. Eigener Spielstand in diesem Browser.</small><small id="err"></small></div>
</div></main>
<button id="fbFloat" type="button" aria-label="Feedback">💬</button>
<div id="fbBox" role="dialog" aria-modal="true" aria-labelledby="fbT"><div class="card">
  <h3 id="fbT"></h3><p id="fbP"></p>
  <div class="thumbs"><button type="button" id="fbUp" aria-label="Gefällt mir">👍</button><button type="button" id="fbDown" aria-label="Gefällt mir nicht">👎</button></div>
  <textarea id="fbText" maxlength="1500"></textarea>
  <div id="fbMsg"></div>
  <div class="row"><button type="button" id="fbClose"></button><button type="button" class="send" id="fbSend" disabled></button></div>
</div></div>
<footer>Beta · Version 0.5 · Build 74 · Maus = Finger, Mausrad = Zoom · Spielstand bleibt in diesem Browser</footer>
<script>
/* Fabian 11.11.: Die ganze Seite folgt der Spielsprache. Bis das Spiel läuft gilt die Browsersprache (wie im Spiel selbst);
   danach meldet das Spiel seine Sprache über window.lcSetLang (Assets/Plugins/WebGL/LcPage.jslib), auch beim Umschalten im Spiel. */
var LC_TX={
 de:{fs:'Vollbild',load:'Unity-Version wird geladen …',hint:'Einmalig rund 27 MB, danach aus dem Browser-Speicher. Eigener Spielstand in diesem Browser.',
     foot:'Beta · Version 0.5 · Build 74 · Maus = Finger, Mausrad = Zoom · Spielstand bleibt in diesem Browser',
     fail:'Konnte nicht starten: ',failEnd:' – bitte einen aktuellen Browser am PC verwenden.',files:'Spieldateien konnten nicht geladen werden.',
     t:'Wie gefällt dir das Spiel?',p:'Daumen hoch oder runter und gern ein paar Worte dazu. Jeder Kommentar hilft.',ph:'Was gefällt dir, was stört dich? (freiwillig)',
     send:'Senden',close:'Schließen',ok:'Danke! Dein Feedback ist angekommen.',err:'Senden hat nicht geklappt – bitte später noch einmal.',up:'Gefällt mir',down:'Gefällt mir nicht'},
 en:{fs:'Fullscreen',load:'Loading the Unity version …',hint:'About 27 MB once, then loaded from your browser. Your save stays in this browser.',
     foot:'Beta · Version 0.5 · Build 74 · Mouse = finger, mouse wheel = zoom · Your save stays in this browser',
     fail:'Could not start: ',failEnd:' – please use an up-to-date browser on a computer.',files:'Game files could not be loaded.',
     t:'How do you like the game?',p:'Thumbs up or down, and a few words if you like. Every comment helps.',ph:'What do you like, what bugs you? (optional)',
     send:'Send',close:'Close',ok:'Thank you! Your feedback has arrived.',err:'Could not send – please try again later.',up:'I like it',down:'I don\'t like it'}};
var LC_LANG=/^de/i.test(navigator.language||'de')?'de':'en';
function LT(k){ return LC_TX[LC_LANG][k]; }
window.lcSetLang=function(l){ LC_LANG=(l==='de')?'de':'en'; var T=LC_TX[LC_LANG], g=function(i){return document.getElementById(i);};
  document.documentElement.lang=LC_LANG;
  g('fs').textContent=T.fs; g('loadT').textContent=T.load; g('loadH').textContent=T.hint; document.querySelector('footer').textContent=T.foot;
  g('fbT').textContent=T.t; g('fbP').textContent=T.p; g('fbText').placeholder=T.ph; g('fbSend').textContent=T.send; g('fbClose').textContent=T.close;
  g('fbUp').setAttribute('aria-label',T.up); g('fbDown').setAttribute('aria-label',T.down); };
window.lcSetLang(window.lcLang||LC_LANG);
</script>
<script>
(function(){
  var mob=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent); if(mob) document.body.classList.add('m');
  var c=document.getElementById('c'),bar=document.querySelector('#bar i'),load=document.getElementById('load'),err=document.getElementById('err');
  /* Fabian 11.11.: GitHub Pages lieferte die Spieldateien zeitweise mit ~30 KB/s. Darum zuerst vom kostenlosen jsDelivr-CDN laden (fest auf den Commit mit diesem Build),
     bei Fehler oder nach 5 s ohne Antwort wie bisher direkt von GitHub. Bei jedem neuen Build CDN_REV auf den Commit setzen, der die neuen Build-Dateien enthält. */
  var CDN_REV='0fd1008', CDN='https://cdn.jsdelivr.net/gh/GhostOFabian/Lunar-Cleanup-Tycoon@'+CDN_REV+'/play-unity/Build/', V='?v=74c';
  var cfg={dataUrl:'',frameworkUrl:'',codeUrl:'',streamingAssetsUrl:'StreamingAssets',
    companyName:'DefaultCompany',productName:'Lunar Cleanup Tycoon',productVersion:'0.5',
    showBanner:function(msg,type){ if(type==='error') err.textContent=msg; }};
  if(mob) cfg.devicePixelRatio=Math.min(window.devicePixelRatio||1,2);
  function base(b,q){ cfg.dataUrl=b+'WebGL-GitHub.data.unityweb'+q; cfg.frameworkUrl=b+'WebGL-GitHub.framework.js.unityweb'+q; cfg.codeUrl=b+'WebGL-GitHub.wasm.unityweb'+q; }
  base('Build/',V);
  var s=document.createElement('script'); s.src='Build/WebGL-GitHub.loader.js'+V;
  s.onload=function(){
    /* Daten (16 MB) sind für jsDelivr zu groß (Grenze pro Datei) – sie liegen in 3 Teilen, werden hier zusammengesetzt und als Blob an Unity gegeben.
       Fortschritt der Teile zählt als erste Hälfte des Balkens. */
    var PARTS=3, got=0, TOTAL=16103583;
    function parts(b,q){ var a=[],ok=0; return Promise.all(Array.from({length:PARTS},function(_,i){ return fetch(b+'WebGL-GitHub.data.part'+i+q).then(function(r){ if(!r.ok) throw r.status;
        var rd=r.body.getReader(), ch=[]; return (function pump(){ return rd.read().then(function(x){ if(x.done) return new Blob(ch); ch.push(x.value); got+=x.value.length; bar.style.width=Math.min(50,got/TOTAL*50)+'%'; return pump(); }); })(); }); })); }
    var done=false, go=function(cdn){ if(done) return; done=true; if(cdn){ cfg.frameworkUrl=CDN+'WebGL-GitHub.framework.js.unityweb'; cfg.codeUrl=CDN+'WebGL-GitHub.wasm.unityweb'; }
      parts(cdn?CDN:'Build/',cdn?'':V).catch(function(){ got=0; return parts('Build/',V); }).then(function(bl){ cfg.dataUrl=URL.createObjectURL(new Blob(bl)); start(cdn); },function(){ err.textContent=LT('files'); }); };
    cfg.cacheControl=function(u){ return /^blob:/.test(u)?'no-store':'must-revalidate'; };
    setTimeout(function(){ go(false); },5000);
    if(/nocdn/.test(location.search)) return go(false);
    try{ fetch(CDN+'WebGL-GitHub.framework.js.unityweb',{method:'HEAD',mode:'cors'}).then(function(r){ go(r.ok); },function(){ go(false); }); }catch(e){ go(false); }
  };
  function start(cdn){
    createUnityInstance(c,cfg,function(p){bar.style.width=(50+p*50)+'%';}).then(function(u){
      load.style.display='none';
      document.getElementById('fs').onclick=function(){u.SetFullscreen(1);};
    }).catch(function(m){ if(cdn){ location.replace(location.pathname+'?nocdn=1'); return; } err.textContent=LT('fail')+m+LT('failEnd');});
  };
  s.onerror=function(){err.textContent=LT('files');};
  document.body.appendChild(s);
})();
/* Fabian 11.11.: Feedback mit Daumen und Kommentar – landet in Fabians Google-Formular (Antworten in Google Sheets).
   Eintragen: Formular-Adresse (…/formResponse) und die drei entry-Nummern aus dem vorausgefüllten Link. Ohne Adresse bleibt der Knopf unsichtbar. */
(function(){
  var GF={url:'https://docs.google.com/forms/d/e/1FAIpQLSc3XUuLh01cYpBmL1B6hfa279A-EJLekDFhh-v2e_4ikxXlJg/formResponse',rate:'entry.1970576894',text:'entry.2051658818',build:''};
  if(!GF.url) return;
  var $=function(i){return document.getElementById(i);}, box=$('fbBox'), rate='';
  var mob=document.body.classList.contains('m'); $(mob?'fbFloat':'fbBtn').style.display='inline-block';
  function open(){ box.style.display='flex'; $('fbMsg').textContent=''; }
  function close(){ box.style.display='none'; }
  function pick(r){ rate=r; $('fbUp').classList.toggle('on',r==='up'); $('fbDown').classList.toggle('on',r==='down'); $('fbSend').disabled=false; }
  $('fbBtn').onclick=open; $('fbFloat').onclick=open; $('fbClose').onclick=close; box.onclick=function(e){ if(e.target===box) close(); };
  $('fbUp').onclick=function(){pick('up');}; $('fbDown').onclick=function(){pick('down');};
  $('fbSend').onclick=function(){
    var f=new FormData(); var info='Build '+document.querySelector('footer').textContent.replace(/.*Build (\d+).*/,'$1')+(mob?' · Handy':' · PC')+(LC_LANG==='en'?' · EN':' · DE'); f.append(GF.rate, rate==='up'?'Up':'Down'); f.append(GF.text, $('fbText').value.slice(0,1500)+'\n['+info+']'); if(GF.build) f.append(GF.build, info);
    $('fbSend').disabled=true;
    fetch(GF.url,{method:'POST',mode:'no-cors',body:f}).then(function(){ $('fbMsg').textContent=LT('ok'); $('fbText').value=''; rate=''; $('fbUp').classList.remove('on'); $('fbDown').classList.remove('on'); setTimeout(close,1600); })
      .catch(function(){ $('fbMsg').textContent=LT('err'); $('fbSend').disabled=false; });
  };
})();

</script>
</body>
</html>
