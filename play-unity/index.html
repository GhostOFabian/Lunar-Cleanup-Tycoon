<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lunar Cleanup Tycoon – Unity-Version (Beta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#070a12;--panel:#111827;--ink:#e8eefc;--dim:#93a0b8;--credit:#ffc24b;--line:#263247}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-family:Oxanium,sans-serif;font-weight:700;letter-spacing:.03em}
header a span{color:var(--credit)}
header .b{display:flex;gap:8px}
header button,header .btn{font:inherit;font-size:.9rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none}
main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
#frame{position:relative;height:100%;max-height:960px;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{width:100%;height:100%;display:block;background:#000}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#load b{font-family:Oxanium,sans-serif;font-size:1.3rem}
#bar{width:70%;height:10px;border-radius:6px;background:#1c2535;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--credit);transition:width .2s}
#load small{color:var(--dim);max-width:34ch;line-height:1.45}
#err{color:#ff8a8a}
footer{color:var(--dim);font-size:.8rem;padding:6px 16px 10px;text-align:center}
body.m header,body.m footer{display:none}body.m main{padding:0}body.m #frame{border:0;border-radius:0;height:100%;width:100%;max-height:none;aspect-ratio:auto}
</style>
</head>
<body>
<header>
  <a href="../index.html">Lunar Cleanup <span>Tycoon</span></a>
  <div class="b"><a class="btn" href="../prototype/index.html">Prototyp</a><button id="fs" type="button">Vollbild</button></div>
</header>
<main><div id="frame">
  <canvas id="c" tabindex="-1"></canvas>
  <div id="load"><b>Unity-Version wird geladen …</b><div id="bar"><i></i></div><small>Einmalig rund 17 MB, danach aus dem Browser-Speicher. Eigener Spielstand in diesem Browser.</small><small id="err"></small></div>
</div></main>
<footer>Beta · Unity-Version 0.13 · Maus = Finger, Mausrad = Zoom · Spielstand bleibt in diesem Browser</footer>
<script>
(function(){
  var mob=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent); if(mob) document.body.classList.add('m');
  var c=document.getElementById('c'),bar=document.querySelector('#bar i'),load=document.getElementById('load'),err=document.getElementById('err');
  var cfg={dataUrl:'Build/WebGL-GitHub.data.unityweb?v=2',frameworkUrl:'Build/WebGL-GitHub.framework.js.unityweb?v=2',codeUrl:'Build/WebGL-GitHub.wasm.unityweb?v=2',streamingAssetsUrl:'StreamingAssets',
    companyName:'DefaultCompany',productName:'Lunar Cleanup Tycoon',productVersion:'0.13',
    showBanner:function(msg,type){ if(type==='error') err.textContent=msg; }};
  if(mob) cfg.devicePixelRatio=Math.min(window.devicePixelRatio||1,2);
  var s=document.createElement('script'); s.src='Build/WebGL-GitHub.loader.js?v=2';
  s.onload=function(){
    createUnityInstance(c,cfg,function(p){bar.style.width=(p*100)+'%';}).then(function(u){
      load.style.display='none';
      document.getElementById('fs').onclick=function(){u.SetFullscreen(1);};
    }).catch(function(m){err.textContent='Konnte nicht starten: '+m+' – bitte einen aktuellen Browser am PC verwenden.';});
  };
  s.onerror=function(){err.textContent='Spieldateien konnten nicht geladen werden.';};
  document.body.appendChild(s);
})();
</script>
</body>
</html>
