<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Cleanup Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D planet; glass HUD strips pinned top and bottom; menus rise as a bottom sheet; a map panel replaces the goal chip when zoomed out.
   Deliberately single-theme (night-side industrial control panel), so all colors are explicit tokens on :root. */
:root{
  --void:#070b16;
  --glass:rgba(12,18,34,.80);
  --glass-hi:rgba(17,25,45,.96);
  --line:rgba(170,190,235,.16);
  --ink:#eef2fb; --ink-2:#a3aec6; --ink-3:#6f7a93;
  --credit:#ffbf4d; --credit-ink:#2a1a00;
  --clean:#6ff2d2; --energy:#7fb4ff; --warn:#ff6b5b; --prod:#d7c4ff;
  --f-display:'Oxanium','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--clean);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line)}
.cr-ico{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff2c4 0 16%,var(--credit) 46%,#c77d12 100%);box-shadow:inset 0 0 0 2px rgba(120,70,0,.35)}

#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-direction:column;gap:7px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud .hit{pointer-events:auto}
.hud-row{display:flex;gap:8px;align-items:stretch;max-width:640px}
.cred{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:14px;min-width:0}
.cred-v{display:flex;flex-direction:column;line-height:1.05}
#credits{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--credit)}
#credits.long{font-size:17px}
.planet-chip{min-width:96px}
#rate{font-size:11px;color:var(--clean);font-variant-numeric:tabular-nums;white-space:nowrap;min-height:12px}
.planet-chip{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:14px;text-align:left}
.planet-chip>span:last-child{min-width:0}
.planet-chip b{display:block;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.planet-chip small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdot{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset -5px -4px 7px rgba(0,0,0,.5)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--credit);color:#1a1206;font:700 11px/17px var(--f-display);text-align:center}
#daily{position:relative}
.stat-pl{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}.stat-pl h4{margin:0 0 4px;font-family:var(--f-display);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.icon-btn{width:44px;min-height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meter{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(10px,1fr) auto;align-items:center;gap:5px;padding:7px 8px;border-radius:12px;text-align:left}
.m-l{color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-family:var(--f-display)}
.meter .v{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:11.5px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:16px;display:block}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .25s}
#energyBar{background:var(--energy)} #rohBar{background:var(--clean)} #prodBar{background:var(--prod)}
.meter.full{border-color:rgba(255,107,91,.55)} .meter.full .bar i{background:var(--warn)!important} .meter.full .v{color:var(--warn)}
.meter.low #energyBar{background:var(--warn)}
.mats{display:flex;gap:6px 12px;font-size:11px;color:var(--ink-2);padding:0 4px;flex-wrap:wrap;max-width:640px}
.mats span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.mats i{width:8px;height:8px;border-radius:2px;display:inline-block}
.quest{align-self:flex-start;max-width:min(440px,100%);display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;text-align:left;border-color:rgba(255,191,77,.35)}
.quest>div:first-child{flex:1;min-width:0}
.q-k{font-family:var(--f-display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--credit)}
.q-t{font-size:13px;line-height:1.3;margin-top:1px}
.quest .bar{margin-top:6px} .quest .bar i{background:var(--credit)}
.q-r{font-family:var(--f-display);font-size:13px;color:var(--credit);white-space:nowrap;display:flex;align-items:center;gap:5px}
.q-r .cr-ico{width:14px;height:14px}
#hz{color:var(--credit)!important;border-color:rgba(255,191,77,.5)!important}
.flowchip{align-self:flex-start;display:flex;align-items:center;gap:8px;max-width:min(440px,100%);padding:6px 12px 6px 9px;border-radius:12px;font-size:12.5px;line-height:1.35;color:var(--ink-1,#eef2fb);text-align:left}
.flowchip i,.ldot{flex:none;width:11px;height:11px;border-radius:50%;background:#3fe58a;box-shadow:0 0 8px currentColor}
.ldot{display:inline-block;margin-right:7px;vertical-align:-1px}
.l0,.flowchip i.l0{background:#3fe58a;color:#3fe58a}.l1,.flowchip i.l1{background:#ffd23f;color:#ffd23f}.l2,.flowchip i.l2{background:#ff4d3d;color:#ff4d3d}.lx{background:#6c7588;color:#6c7588;box-shadow:none}
.warnchip{align-self:flex-start;max-width:min(440px,100%);padding:7px 12px;border-radius:12px;font-size:12.5px;line-height:1.35;color:var(--warn);border-color:rgba(255,107,91,.45);text-align:left}
#mapPanel{align-self:flex-start;width:min(360px,100%);padding:12px 14px;border-radius:14px}
#mapPanel h4{margin:0 0 6px;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
#mapPanel .kv{margin:0}
.qline{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(160,182,232,.08);font-size:13px;color:var(--ink-2)}.qline span{flex:none;min-width:22px;font:600 12px var(--f-display);color:var(--ink-3)}.qline.ok{color:var(--ink-3)}.qline.ok span{color:var(--clean)}.qline.now{color:var(--ink);font-weight:700}.qline.now span{color:var(--credit)}
.codebox{width:100%;min-height:74px;margin:8px 0;padding:10px;border-radius:12px;border:1px solid rgba(160,182,232,.2);background:rgba(5,9,18,.6);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
#mapPanel h4{display:flex;align-items:center;gap:8px}#mapPanel .mm{margin-left:auto;font:600 11px var(--f-display);letter-spacing:.08em;color:var(--ink-2);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:6px 10px;min-height:32px;cursor:pointer}
#mapPanel.min{padding:6px 8px 6px 14px}#mapPanel.min h4{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

#nav{position:absolute;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;border-width:1px 0 0;
  padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--ink-2);font-size:10.5px;min-height:52px;min-width:0}
#nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--ink);background:rgba(255,255,255,.07)}
#nav button[data-nav="clean"]{color:var(--clean)}
#nav button[data-nav="clean"].cam{color:var(--energy)}
#mEnergy.night .m-l{color:#9fb6ff}
#handBtn{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px 8px 10px;border-radius:16px;color:var(--ink);font:600 12px var(--f-display);letter-spacing:.04em}
#handBtn svg{width:22px;height:22px;stroke:var(--clean);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#handBtn span{display:flex;flex-direction:column;gap:4px;min-width:64px}#handBtn .bar{display:block;height:5px;width:64px}#handBar{display:block;height:100%;width:0;border-radius:3px;background:var(--clean)}
#handBtn.full #handBar{background:var(--warn)}#handBtn.cart{border-color:var(--clean);box-shadow:0 0 0 2px rgba(111,242,210,.45)}#handBtn.cart #handBar{background:var(--clean)}#handBtn.pulse{animation:hpulse 1s ease-in-out infinite}@keyframes hpulse{50%{box-shadow:0 0 0 3px rgba(255,107,91,.55)}}@media (prefers-reduced-motion:reduce){#handBtn.pulse{animation:none;box-shadow:0 0 0 2px rgba(255,107,91,.7)}}
#fab{position:absolute;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#fab button{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
#fab svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#sheet{position:absolute;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;max-height:min(62%,580px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;border-radius:20px 20px 0 0;background:var(--glass-hi);border:1px solid var(--line);border-bottom:0;transform:translateY(18px);opacity:0;transition:transform .22s ease,opacity .22s ease}
#sheet.open{transform:none;opacity:1}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#sheetKicker{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);min-height:12px}
#sheetTitle{margin:2px 0 0;font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.02em;text-wrap:balance}
#sheetClose{font-size:26px;line-height:1;color:var(--ink-2)}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;gap:18px;padding-block:6px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec h3{margin:0 0 4px;font-family:var(--f-display);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.sec h3+.row,.sec h3+.note+.row{border-top:0}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;font-size:14.5px;line-height:1.25}
.row-d{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.row .bar{margin-top:7px;max-width:260px}
.row .bar i{background:var(--clean)}
.lvl{font-weight:400;font-size:11px;color:var(--ink-3);margin-left:7px;font-family:var(--f-display);letter-spacing:.04em}
.note{margin:0 0 6px;font-size:12.5px;line-height:1.45;color:var(--ink-2);max-width:62ch}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--credit);color:var(--credit-ink);font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;min-height:42px;min-width:64px;font-variant-numeric:tabular-nums;flex:none}
.buy .cr-ico{width:14px;height:14px}
.buy:disabled{background:rgba(255,255,255,.07);color:var(--ink-3);cursor:default}
.buy:disabled .cr-ico{filter:grayscale(1);opacity:.5}
.buy.alt{background:rgba(111,242,210,.13);color:var(--clean)}
.buy.off{background:rgba(255,255,255,.07);color:var(--ink-2)}
.buy.danger{background:rgba(255,107,91,.14);color:var(--warn)}
.buy.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11.5px;background:rgba(255,255,255,.08);color:var(--ink-2);white-space:nowrap;flex:none}
.pill.ok{background:rgba(111,242,210,.14);color:var(--clean)}
.pill.warn{background:rgba(255,107,91,.15);color:var(--warn)}
.big-bar{height:10px;border-radius:5px;margin:6px 0 4px;max-width:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:4px 0 2px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.psphere{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset -8px -6px 12px rgba(0,0,0,.55)}
.locked .psphere{filter:grayscale(.6) brightness(.6)}
.stage{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stage .row-t{font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--ink-2);line-height:1.6}
.flow b{color:var(--ink);font-weight:700}
.flow .arr{color:var(--ink-3)}

#modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,6,14,.6);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(440px,100%);max-height:calc(100% - 24px);overflow-y:auto;border-radius:22px;padding:22px 20px 20px;background:var(--glass-hi);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card .kick{font-family:var(--f-display);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--clean)}
.card h2{margin:6px 0 10px;font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:700;text-wrap:balance}
.card p{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.card ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.card ul b{color:var(--ink)}
.sum-big{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--credit);margin:4px 0 14px;font-variant-numeric:tabular-nums}
.sum-big .cr-ico{width:30px;height:30px}
.sum-pl{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.sum-pl h4{margin:0 0 4px;font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.sum-pl .warn{color:var(--warn)}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--ink-2);margin:0 0 16px}
.controls b{color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 200px);z-index:12;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{padding:9px 14px;border-radius:12px;font-size:13px;max-width:420px;text-align:center;animation:tin .25s ease;transition:opacity .4s,transform .4s}
.toast.good{border-color:rgba(111,242,210,.45)} .toast.bad{border-color:rgba(255,107,91,.55)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#ft{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--credit);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;will-change:transform,opacity}
.ft.auto{color:var(--clean);font-size:12.5px}
.ft.big{font-size:22px}
.ft.mat{color:#d8dee6;font-size:12.5px}
#fade{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
#fade.on{opacity:1;pointer-events:auto}
#loading{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--void);font-family:var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-size:13px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){#credits{font-size:26px}.q-t{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <canvas id="c" aria-label="3D-Planet"></canvas>
  <div id="ft"></div>

  <div id="hud">
    <div class="hud-row">
      <div class="cred glass hit" role="status">
        <span class="cr-ico" aria-hidden="true"></span>
        <span class="cred-v"><span id="credits">0</span><span id="rate"></span></span>
      </div>
      <button id="planetChip" class="planet-chip glass hit" aria-label="Planeten">
        <span class="pdot" id="pdot"></span>
        <span><b id="pname">Mond</b><small id="pprog"></small></span>
      </button>
      <button id="daily" class="icon-btn glass hit" aria-label="Tägliche Aufträge"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10l1.5 1.5 3-3M8.5 16h7"/></svg><span id="dailyBadge" class="badge" hidden></span></button>
      <button id="gear" class="icon-btn glass hit" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>

    const u1=[(p1[0]-p0[0])/l1,(p1[1]-p0[1])/l1],u2=[(p2[0]-p1[0])/l2,(p2[1]-p1[1])/l2],c=u1[0]*u2[0]+u1[1]*u2[1];if(c>.999){out.push(p1.slice());continue;}
    const th=Math.acos(clamp(c,-1,1)),t=Math.min(r*Math.tan(th/2),l1*(i===1?.9:.48),l2*(i===path.length-2?.9:.48)),a=[p1[0]-u1[0]*t,p1[1]-u1[1]*t],b=[p1[0]+u2[0]*t,p1[1]+u2[1]*t],n=Math.max(4,Math.ceil(th*6));

  for(let t=0;t<=4.001;t+=.05){const c=[a[0]+ux*t,a[1]+uy*t],d=Math.hypot(c[0]-B.pos[0],c[1]-B.pos[1]);if(d<=lim){best=c;break;}if(d<bd){bd=d;best=c;}}

  const IV=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(vnorm);
  const IF=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const verts=[],map=new Map(),tris=[];
  for(const[ia,ib,ic]of IF){const A=IV[ia],B=IV[ib],C=IV[ic],idx=[];
    for(let i=0;i<=n;i++){idx[i]=[];for(let j=0;j<=n-i;j++){const k=n-i-j;
      const p=vnorm([(A[0]*k+B[0]*i+C[0]*j)/n,(A[1]*k+B[1]*i+C[1]*j)/n,(A[2]*k+B[2]*i+C[2]*j)/n]);
      const key=Math.round(p[0]*1e6)+'_'+Math.round(p[1]*1e6)+'_'+Math.round(p[2]*1e6);let id=map.get(key);if(id===undefined){id=verts.length;verts.push(p);map.set(key,id);}idx[i][j]=id;}}
    for(let i=0;i<n;i++)for(let j=0;j<n-i;j++){tris.push([idx[i][j],idx[i+1][j],idx[i][j+1]]);if(i+j<n-1)tris.push([idx[i+1][j],idx[i+1][j+1],idx[i][j+1]]);}}
  const inc=verts.map(()=>[]),nbs=verts.map(()=>new Set());
  tris.forEach((tr,ti)=>{for(let q=0;q<3;q++){inc[tr[q]].push(ti);nbs[tr[q]].add(tr[(q+1)%3]);nbs[tr[q]].add(tr[(q+2)%3]);}});
  const tc=tris.map(tr=>vnorm(vadd(vadd(verts[tr[0]],verts[tr[1]]),verts[tr[2]])));
  return{faceCenters:IF.map(f=>vnorm(vadd(vadd(IV[f[0]],IV[f[1]]),IV[f[2]]))),cells:verts.map((c,i)=>{const r0=tc[inc[i][0]],ref=vnorm(vsub(r0,vsc(c,vdot(r0,c)))),ref2=vcross(c,ref);
    const corners=inc[i].map(ti=>tc[ti]).sort((p,q)=>Math.atan2(vdot(p,ref2),vdot(p,ref))-Math.atan2(vdot(q,ref2),vdot(q,ref)));
    return{c,corners,nb:[...nbs[i]]};})};
}
const PD={};
function planetData(pid){
  if(PD[pid])return PD[pid];
  const P=PLANETS[pid],g=geodesic(P.freq),N=g.cells.length,R=Math.sqrt(N*140/(4*Math.PI)),r=rng(P.freq*7919+11);
  const cells=g.cells.map((cl,i)=>{
    const c=cl.c,e1=vnorm(vsub(cl.corners[0],vsc(c,vdot(cl.corners[0],c)))),e2=vcross(c,e1);
    const poly=cl.corners.map(p=>{const t=R/vdot(p,c);return[vdot(p,e1)*t,vdot(p,e2)*t];});
    let H=0;for(const q of poly)H=Math.max(H,Math.hypot(q[0],q[1]));H*=1.02;
    const cs=2*H/GRID,inside=new Uint8Array(CELLS);let nIn=0;
    for(let gy=0;gy<GRID;gy++)for(let gx=0;gx<GRID;gx++){const x=-H+(gx+.5)*cs,y=-H+(gy+.5)*cs;let ok=true;
      for(let k=0;k<poly.length;k++){const a=poly[k],b=poly[(k+1)%poly.length],ex=b[0]-a[0],ey=b[1]-a[1];if((ex*(y-a[1])-ey*(x-a[0]))/Math.hypot(ex,ey)<.08){ok=false;break;}}
      if(ok){inside[gy*GRID+gx]=1;nIn++;}}
    return{id:i,c,e1,e2,poly,H,cs,inside,nIn,nb:cl.nb,ring:99,type:null,kind:'normal',chunk:0};
  });
  const want=vnorm([.35,.55,.76]);let base=0,bd=-2;
  for(const cl of cells)if(cl.poly.length===6){const d=vdot(cl.c,want);if(d>bd){bd=d;base=cl.id;}}
  cells[base].ring=0;const q=[base];
  while(q.length){const a=q.shift();for(const b of cells[a].nb)if(cells[b].ring>cells[a].ring+1){cells[b].ring=cells[a].ring+1;q.push(b);}}
  const ks=[0,1,2,3].map(()=>[vnorm([r()-.5,r()-.5,r()-.5]),2+r()*3,r()*TAU]);
  const noise=c=>ks.reduce((s,[k,f,ph])=>s+Math.sin(vdot(c,k)*f+ph),0);
  const order=cells.map(cl=>cl.id).sort((a,b)=>noise(cells[a].c)-noise(cells[b].c));
  let acc=0,ti=0;const types=P.types;
  order.forEach((id,n)=>{while(ti<types.length-1&&n>=(acc+types[ti][1])*N){acc+=types[ti][1];ti++;}cells[id].type=types[ti][0];});
  const ks2=[vnorm([r()-.5,r()-.5,r()-.5]),vnorm([r()-.5,r()-.5,r()-.5])];
  for(const cl of cells){
    if(cl.ring<=2){cl.type=P.start;cl.kind='base';continue;}
    if(cl.ring===3){cl.type=r()<.7?P.start:types[1][0];continue;}
    const n2=Math.sin(vdot(cl.c,ks2[0])*6)+Math.sin(vdot(cl.c,ks2[1])*5),rr=r();
    if(cl.ring>=5&&n2>1.45)cl.kind='industrial';else if(cl.ring>=4&&rr<.06)cl.kind='rich';else if(cl.ring>=6&&rr<.09)cl.kind='anomaly';
  }
  let start=-1;{let bd2=-2;const dirS=vnorm(vadd(cells[base].c,vsc(cells[base].e2,-.5)));for(const cl of cells)if(cl.ring===3){const d=vdot(cl.c,dirS);if(d>bd2){bd2=d;start=cl.id;}}}
  cells[start].type=P.start;cells[start].kind='normal';
  for(const cl of cells){let best=0,bdot=-2;g.faceCenters.forEach((f,k)=>{const d=vdot(cl.c,f);if(d>bdot){bdot=d;best=k;}});cl.chunk=best;}
  return PD[pid]={pid,R,N,cells,base,start};
}

  const w=W[pid]={owned:new Uint8Array(pd.N),clean:new Uint8Array(pd.N),paid:new Uint8Array(pd.N),disc:new Uint8Array(pd.N),act:new Map()};
  for(const id of sp.owned)w.owned[id]=1;
  if(sp.clean)decBytes(sp.clean,w.clean);if(sp.paid)decBytes(sp.paid,w.paid);
  for(const cl of pd.cells)if(cl.kind==='base'){w.clean[cl.id]=1;w.paid[cl.id]=1;w.owned[cl.id]=1;}
  for(let id=0;id<pd.N;id++)if(pd.cells[id].kind!=='base'&&((w.owned[id]&&!w.clean[id])||(sp.act[id]&&sp.act[id].r)))activate(pid,id,sp.act[id]);
  w.nClean=0;for(const cl of pd.cells)if(cl.kind!=='base'&&w.clean[cl.id])w.nClean++;
  calcFront(pid);updDiscovered(pid);
}
function updDiscovered(pid){const w=W[pid],pd=planetData(pid);w.disc.fill(0);const dist=new Int16Array(pd.N).fill(99),q=[];
  for(let i=0;i<pd.N;i++)if(w.owned[i]){dist[i]=0;q.push(i);}
  while(q.length){const a=q.shift();if(dist[a]>=3)continue;for(const b of pd.cells[a].nb)if(dist[b]>dist[a]+1){dist[b]=dist[a]+1;q.push(b);}}
  for(let i=0;i<pd.N;i++)if(dist[i]<=3)w.disc[i]=1;}
const adjacentOwned=(pid,id)=>planetData(pid).cells[id].nb.some(b=>W[pid].owned[b]);
const ownedCount=pid=>{let n=0;const o=W[pid].owned;for(let i=0;i<o.length;i++)n+=o[i];return n;};
const DUST_YIELD=.8; // material per fully dusted parcel, relative to the start dirt (×1.6 on finished planets)
/* Frontier: every dirty parcel next to a clean one (or the base) can be cleaned right away – by hand or by vehicles. No unlocking. */
function frontWhy(pid,id){const w=W[pid],cl=planetData(pid).cells[id];
  if(cl.kind==='base')return 'Basisgelände';if(w.clean[id])return 'Schon sauber';
  if(!cl.nb.some(b=>w.clean[b]))return 'Erst eine angrenzende Parzelle reinigen';
  if(cl.kind==='anomaly'&&!S.planets[pid].bld.research)return 'Forschungsgebiete brauchen eine Forschungsstation';return '';}
const isFront=(pid,id)=>!frontWhy(pid,id);
function calcFront(pid){const w=W[pid],pd=planetData(pid);w.front=new Set();for(let i=0;i<pd.N;i++)if(isFront(pid,i))w.front.add(i);}
function frontAfterClean(pid,id){const w=W[pid];w.front.delete(id);for(const b of planetData(pid).cells[id].nb)if(isFront(pid,b))w.front.add(b);}
const workable=(pid,id)=>{const w=W[pid];return w.act.has(id)||w.front.has(id);};
function ensureAct(pid,id){const w=W[pid];let a=w.act.get(id);if(a)return a;if(!w.front.has(id))return null;
  w.owned[id]=1;a=activate(pid,id);updDiscovered(pid);
  if(pid===S.planet&&world&&!TRACK){buildActiveMesh(pid,a);paintCell(pid,id);for(const b of a.cl.nb)paintCell(pid,b);}
  return a;}
const parcelYield=cl=>DIRT[cl.type].amt*KINDS[cl.kind].amt;
const cellArea=cl=>cl.nIn*cl.cs*cl.cs;

function cleanAt(a,x,y,r,k,draw){
  const cl=a.cl,H=cl.H,cs=cl.cs,lx=x+H,ly=y+H;
  if(lx<-r||ly<-r||lx>2*H+r||ly>2*H+r)return 0;
  const g=a.grid,ins=cl.inside,r2=r*r;let removed=0;
  const gx0=Math.max(0,Math.floor((lx-r)/cs)),gx1=Math.min(GRID-1,Math.floor((lx+r)/cs));
  const gy0=Math.max(0,Math.floor((ly-r)/cs)),gy1=Math.min(GRID-1,Math.floor((ly+r)/cs));
  for(let gy=gy0;gy<=gy1;gy++){const dy=(gy+.5)*cs-ly;for(let gx=gx0;gx<=gx1;gx++){const idx=gy*GRID+gx;if(!ins[idx])continue;const dx=(gx+.5)*cs-lx,d2=dx*dx+dy*dy;if(d2>=r2)continue;
    const o=g[idx];if(o<=0)continue;let n=o*(1-k*(1-d2/r2));if(n<0.02)n=0;g[idx]=n;removed+=o-n;}}
  if(removed>0){a.sum-=removed;if(a.sum<0)a.sum=0;a.saveDirty=true;}
  if(draw){const s=MASK/(2*H),ctx=a.ctx;ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=Math.min(1,k*1.05);ctx.drawImage(BRUSH,(lx-r)*s,(ly-r)*s,2*r*s,2*r*s);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';a.texDirty=true;}
  else if(removed>0)a.maskStale=true;
  return removed;
}
function syncMask(a){
  const img=a.ctx.getImageData(0,0,MASK,MASK),d=img.data,g=a.grid,sc=GRID/MASK;
  for(let y=0;y<MASK;y++){const gy=clamp((y+.5)*sc-.5,0,GRID-1),y0=gy|0,y1=Math.min(GRID-1,y0+1),fy=gy-y0;
    for(let x=0;x<MASK;x++){const gx=clamp((x+.5)*sc-.5,0,GRID-1),x0=gx|0,x1=Math.min(GRID-1,x0+1),fx=gx-x0;
      const v=(g[y0*GRID+x0]*(1-fx)+g[y0*GRID+x1]*fx)*(1-fy)+(g[y1*GRID+x0]*(1-fx)+g[y1*GRID+x1]*fx)*fy;
      const al=Math.min(255,v*300),i=(y*MASK+x)*4+3;if(d[i]>al)d[i]=al;}}
  a.ctx.putImageData(img,0,0);a.maskStale=false;a.texDirty=true;
}
const prog=a=>1-a.sum/a.cl.nIn;

function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64d(str){const s=atob(str),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function decBytes(str,out){const u=b64d(str);out.set(u.subarray(0,out.length));}
function encGrid(g){const u=new Uint8Array(CELLS);for(let i=0;i<CELLS;i++)u[i]=Math.round(clamp(g[i],0,1)*255);return b64e(u);}
function decGrid(s,g,ins){const u=b64d(s);for(let i=0;i<CELLS&&i<u.length;i++)g[i]=ins[i]?u[i]/255:0;}
const MS=128,mtmp=mkCanvas(MS),mctx=mtmp.getContext('2d',{willReadFrequently:true});
function encMask(a){mctx.clearRect(0,0,MS,MS);mctx.drawImage(a.canvas,0,0,MS,MS);const d=mctx.getImageData(0,0,MS,MS).data,u=new Uint8Array(MS*MS);for(let i=0;i<u.length;i++)u[i]=d[i*4+3];return b64e(u);}
function applyMask(a,str){const u=b64d(str),img=mctx.createImageData(MS,MS);for(let i=0;i<MS*MS;i++){const j=i*4;img.data[j]=img.data[j+1]=img.data[j+2]=255;img.data[j+3]=u[i]||0;}
  mctx.putImageData(img,0,0);a.ctx.globalCompositeOperation='destination-in';a.ctx.drawImage(mtmp,0,0,MASK,MASK);a.ctx.globalCompositeOperation='source-over';}

const KEY='lunar-cleanup-tycoon-v2';
/* Saving: lean JSON (cell grids only, masks are rebuilt from them), a rolling backup slot, a copy of anything unreadable,
   optional cloud save (Claude artifact db, private per player) and export/import codes. A save is never silently replaced by a fresh game. */
let saveFailT=0,lastBak=0,bootFresh=false,bootLocalT=0;
function serialize(){
  S.lastActive=Date.now();
  for(const pid in W){const sp=S.planets[pid],w=W[pid];if(!sp)continue;
    sp.owned=[];for(let i=0;i<w.owned.length;i++)if(w.owned[i])sp.owned.push(i);
    sp.clean=b64e(w.clean);sp.paid=b64e(w.paid);
    const act={};for(const[id,a]of w.act){const old=sp.act[id];if(!a.saveDirty&&old&&old.g){act[id]={g:old.g,r:old.r||0};continue;}act[id]={g:encGrid(a.grid),r:a.dust?1:0};a.saveDirty=false;}
    sp.act=act;}
  return JSON.stringify(S);}
function save(){
  if(!S)return;let json;
  try{json=serialize();}catch(e){return;}
  try{localStorage.setItem(KEY,json);if(Date.now()-lastBak>300000){lastBak=Date.now();localStorage.setItem(KEY+'-bak',json);}}
  catch(e){if(Date.now()-saveFailT>60000){saveFailT=Date.now();try{toast(CLOUD.ok?'Lokales Speichern fehlgeschlagen – der Cloud-Spielstand läuft weiter':'Speichern fehlgeschlagen. Sichere deinen Stand unter Einstellungen → Spielstand exportieren','bad');}catch(_){}}}
  cloudPush(json,false);
}
function normalizeSave(o){
  if(!o||o.v!==2||!o.planets||!o.planets.moon)return null;
  const b=freshSave();Object.assign(b,o);b.locMig=o.locMig?1:0;b.qv=o.qv||1;b.life=Object.assign({earned:o.stats&&o.stats.earned||0},o.life||{});b.ctr=Object.assign({sold:{},cells:0},o.ctr||{});b.upg=o.upg||{};b.research=Object.assign({done:{},active:null},o.research||{});b.stats=Object.assign(freshSave().stats,o.stats||{});
  for(const pid in b.planets){if(!PLANETS[pid]){delete b.planets[pid];continue;}const sp=b.planets[pid],f=freshPlanet(pid);for(const k in f)if(sp[k]===undefined||sp[k]===null)sp[k]=f[k];
    for(const k in f.st)if(!sp.st[k])sp.st[k]=f.st[k];for(const k in f.mach)if(!sp.mach[k])sp.mach[k]=f.mach[k];for(const k in f.belts)if(!sp.belts[k])sp.belts[k]=[];
    RAW.forEach(k=>{if(sp.roh[k]==null)sp.roh[k]=0;});PRODS.forEach(k=>{if(sp.prod[k]==null)sp.prod[k]=0;});}
  if(!b.planets[b.planet])b.planet='moon';
  return b;}
function load(){
  let t=null;try{t=localStorage.getItem(KEY);}catch(e){return null;}
  let b=null;if(t){try{b=normalizeSave(JSON.parse(t));}catch(e){b=null;}}
  if(!b){let k=null;try{k=localStorage.getItem(KEY+'-bak');}catch(e){}if(k){try{b=normalizeSave(JSON.parse(k));}catch(e){b=null;}}
    if(t&&!b){try{localStorage.setItem(KEY+'-broken-'+Date.now(),t);}catch(e){}}}
  return b;}
/* ---- cloud save (only inside the Claude viewer; private per player) ---- */
const CLOUD={ok:false,busy:false,last:0,status:'Wird geprüft …',slot:0,pending:null};
const CHUNK=180000;
async function cloudRead(){const db=CLOUD.db,base='data/users/'+CLOUD.uid+'/';const m=await db.doc(base+'save').get();if(!m.exists)return null;const d=m.data();if(!d||!d.n)return null;
  let s='';for(let i=0;i<d.n;i++){const c=await db.doc(base+'save_'+d.slot+'_'+i).get();if(!c.exists)return null;s+=c.data().s;}if(s.length!==d.len)return null;CLOUD.slot=d.slot;return{json:s,t:d.t};}
async function cloudPush(json,force){if(!CLOUD.ok)return;if(CLOUD.busy){CLOUD.pending=json;return;}if(!force&&Date.now()-CLOUD.last<45000)return;
  CLOUD.busy=true;try{const db=CLOUD.db,base='data/users/'+CLOUD.uid+'/',slot=CLOUD.slot?0:1,n=Math.ceil(json.length/CHUNK);
    for(let i=0;i<n;i++)await db.doc(base+'save_'+slot+'_'+i).set({s:json.slice(i*CHUNK,(i+1)*CHUNK)});
    await db.doc(base+'save').set({slot,n,len:json.length,t:S.lastActive||Date.now(),credits:Math.round(S.credits),planet:S.planet});
    CLOUD.slot=slot;CLOUD.last=Date.now();CLOUD.status='Verbunden · gesichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
  catch(e){CLOUD.status='Fehler beim Sichern ('+(e&&e.code||'unbekannt')+') – versucht es gleich erneut';}
  finally{CLOUD.busy=false;if(CLOUD.pending){const p=CLOUD.pending;CLOUD.pending=null;setTimeout(()=>cloudPush(p,true),2000);}}}
async function cloudInit(){
  try{if(!window.claude||typeof window.claude.use!=='function'){CLOUD.status='Nicht verfügbar – nur dieses Gerät';return;}
    const db=await window.claude.use('db'),user=await window.claude.use('user');if(!db||!user){CLOUD.status='Nicht verfügbar – nur dieses Gerät';return;}
    const uid=await user.id();if(!uid){CLOUD.status='Nicht angemeldet – nur dieses Gerät';return;}
    CLOUD.db=db;CLOUD.uid=uid;let remote=null;try{remote=await cloudRead();}catch(e){CLOUD.status='Cloud gerade nicht erreichbar';return;}
    CLOUD.ok=true;CLOUD.status='Verbunden';
    if(remote){let b=null;try{b=normalizeSave(JSON.parse(remote.json));}catch(e){}
      if(b&&(bootFresh||remote.t>bootLocalT+2000)){adoptSave(b,'Cloud-Spielstand geladen');return;}}
    save();cloudPush(serialize(),true);}
  catch(e){CLOUD.status='Nicht verfügbar – nur dieses Gerät';}}
/* ---- export / import ---- */
async function exportCode(){const json=serialize();
  if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'LCT1:'+b64e(buf);}
  return 'LCT0:'+b64e(new TextEncoder().encode(json));}
async function importCode(code){code=(code||'').trim().replace(/\s+/g,'');let json;
  if(code.startsWith('LCT1:')){if(!window.DecompressionStream)throw new Error('Dieser Browser kann den Code nicht entpacken');const ds=new Blob([b64d(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'));json=await new Response(ds).text();}
  else if(code.startsWith('LCT0:'))json=new TextDecoder().decode(b64d(code.slice(5)));else throw new Error('Das ist kein Spielstand-Code');
  const b=normalizeSave(JSON.parse(json));if(!b)throw new Error('Code beschädigt oder unvollständig');return b;}

/* ===================== 4. Simulation (one code path for live and offline) ===================== */
let saleAcc=0;
function earn(cr,auto){S.credits+=cr;S.stats.earned+=cr;S.life.earned=(S.life.earned||0)+cr;if(TRACK)TRACK.credits+=cr;else if(auto)saleAcc+=cr;}
const tankCap=v=>VT[v.type].tank*uv('vtank');
const isOut=s=>typeof s==='string'&&s[0]==='o';
const stDef=s=>isOut(s)?OUTPOST:BLD[s].st;
const stDocks=id=>stDef(id).docks+uv('udock');
const stBuf=id=>stDef(id).buf*uv('ubuf');
const stObj=(sp,s)=>isOut(s)?sp.outposts.find(o=>o.key===s)||null:(sp.bld[s]?sp.st[s]:null);
const stName=s=>isOut(s)?'Außenlager '+cellName(+s.slice(1)):BLD[s].name;
function stDir(pid,s,kind,k){const pd=planetData(pid);
  if(isOut(s)){const p=kind==='a'?[6,0]:kind==='d'?[2.9,-(k-(OUTPOST.docks-1)/2)*2]:[0,0];return toDir(pd.cells[+s.slice(1)],p[0],p[1],pd.R);}
  const p=kind==='a'?approachPos(s):kind==='d'?dockPos(s,k):BLD[s].pos;return basePlanDir(pd,p[0],p[1]);}
const vehSlots=pid=>{const sp=S.planets[pid];return(gs(sp)>=2?4:0)+(sp.bld.werkstatt?4:0)+(sp.stage>=4?4:0)+(sp.stage>=5?6:0)+uv('slots')+doneCount()+(sp.exp||0);};
const packet=()=>8*uv('bcap');
const beltSpeed=()=>2.4*uv('bspeed');
const BSP=1.25,DONE=.03;
const beltLive=(sp,b)=>!!(sp.bld[b.from]&&sp.bld[b.to]&&(!b.stage||gs(sp)>=b.stage));
const pressable=(sp,m)=>(m==='staub'&&sp.plan.pressStaub)||(m==='metall'&&sp.plan.pressMetall);
const smeltOn=sp=>!!(sp.plan.smelt&&sp.bld.schmelze);
const machIn=M=>sumObj(M.in),machOut=M=>sumObj(M.out);
const machInCap=id=>MACH[id].inCap*uv('mcap'),machOutCap=id=>MACH[id].outCap*uv('mcap');

const sellCap=()=>uv('sellcap'),rocketTime=()=>12/uv('rspeed');
function destFree(sp,b){if(b.to==='roh')return rohCap()-rohSum(sp);if(b.to==='prod')return prodCap()-prodSum(sp);if(b.to==='sell')return sellCap()-sumObj(sp.sellBuf);if(MACH[b.to])return machInCap(b.to)-machIn(sp.mach[b.to]);return 0;}
function beltTake(sp,b,lim){
  if(lim==null)lim=1e9;const P=Math.min(packet(),lim),PB=Math.min(Math.max(1,Math.round(packet()/8)),Math.floor(lim+1e-9));if(P<=1e-6)return null;
  const pick=(o,keys,min,cap,whole)=>{let best=null;for(const m of keys)if((o[m]||0)>=min&&(!best||o[m]>o[best]))best=m;if(!best)return null;let a=Math.min(cap,o[best]);if(whole)a=Math.floor(a+1e-9);if(a<min)return null;o[best]-=a;if(o[best]<1e-6)o[best]=0;return{m:best,a};};
  if(STATIONS.includes(b.from)){const buf=sp.st[b.from].buf;let keys=Object.keys(buf);if(b.to==='presse')keys=keys.filter(m=>pressable(sp,m));const p0=pick(buf,keys,Math.min(1,P),P);if(p0)return p0;
    let tot=0;for(const m of keys)tot+=buf[m]||0;return tot>0&&tot<1?pick(buf,keys,1e-6,P):null;}
  if(b.from==='roh'&&b.to==='sell'){const over=rohSum(sp)>=rohCap()*.9,om=sp.order&&sp.autoOrder!==false?sp.order.m:null;
    if(om&&(sp.roh[om]||0)>=1){const reserve=(om==='staub'||om==='metall')&&sp.bld.presse&&pressable(sp,om)?rohCap()*.08:(om==='kristall'||om==='chemie')&&sp.bld.raff&&sp.plan.refine?rohCap()*.08:0;
      if(sp.roh[om]-reserve>=1){const pk=pick(sp.roh,[om],1,Math.min(P,sp.roh[om]-reserve));if(pk)return pk;}}
    return pick(sp.roh,RAW.filter(m=>sp.auto[m]||over),1,P);}
  if(b.from==='prod'&&b.to==='sell'){const over=prodSum(sp)>=prodCap()*.9;return PB>=1?pick(sp.prod,PRODS.filter(m=>sp.auto[m]||over),1,PB,1):null;}
  if(b.from==='roh'){if(b.to==='presse')return pick(sp.roh,['staub','metall'].filter(m=>pressable(sp,m)),1,P);if(b.to==='raff')return sp.plan.refine?pick(sp.roh,['kristall','chemie'],1,P):null;}
  if(b.from==='presse'){const o=sp.mach.presse.out;if(b.to==='schmelze')return smeltOn(sp)?pick(o,['metallBrick'],1,PB,1):null;return pick(o,smeltOn(sp)?['staubBrick']:['staubBrick','metallBrick'],1,PB,1);}
  if(b.from==='schmelze')return pick(sp.mach.schmelze.out,['barren'],1,PB,1);
  if(b.from==='raff')return pick(sp.mach.raff.out,['reinkristall','polymer'],1,PB,1);
  return null;
}
function beltAccept(sp,b,m,a){
  if(b.to==='roh'){if(rohSum(sp)+a>rohCap()+1e-6)return false;sp.roh[m]+=a;return true;}
  if(b.to==='prod'){if(prodSum(sp)+a>prodCap()+1e-6)return false;sp.prod[m]+=a;return true;}
  if(b.to==='sell'){if(sumObj(sp.sellBuf)+a>sellCap()+1e-6)return false;sp.sellBuf[m]=(sp.sellBuf[m]||0)+a;return true;}
  if(MACH[b.to]){const M=sp.mach[b.to];if(!MACH[b.to].rec.some(rc=>rc.in===m))return false;if(machIn(M)+a>machInCap(b.to)+1e-6)return false;M.in[m]=(M.in[m]||0)+a;return true;}
  return false;
}
function beltStep(sp,b,dt,f){
  if(!beltLive(sp,b))return false;
  const items=sp.belts[b.id],L=b.L,v=beltSpeed()*Math.max(.25,f)*(sp.bm||1);let moved=false;
  for(let i=0;i<items.length;i++){const it=items[i],lim=i===0?L:items[i-1][0]-BSP,ns=Math.min(it[0]+v*dt,lim);if(ns>it[0]+1e-4)moved=true;if(ns>it[0])it[0]=ns;}
  let jam=false;
  while(items.length&&items[0][0]>=L-1e-3){const h=items[0];if(beltAccept(sp,b,h[1],h[2]))items.shift();else{jam=true;break;}}
  if(!items.length||items[items.length-1][0]>=BSP){let tr=0;for(const o of BELTS)if(o.to===b.to&&beltLive(sp,o))for(const it of sp.belts[o.id])tr+=it[2];const pk=beltTake(sp,b,destFree(sp,b)-tr);if(pk)items.push([0,pk.m,pk.a]);}
  sp.jam[b.id]=jam;return moved;
}
function machStep(sp,id,dt,f){
  const D=MACH[id],M=sp.mach[id];if(!sp.bld[id]){M.status='Nicht gebaut';return;}
  if(M.cur<0){for(let r=0;r<D.rec.length;r++){const rc=D.rec[r];if(rc.plan&&!sp.plan[rc.plan])continue;if((M.in[rc.in]||0)>=rc.n-1e-6&&machOut(M)+rc.k<=machOutCap(id)){M.cur=r;M.prog=0;break;}}
    if(M.cur<0){M.status=machOut(M)+1>machOutCap(id)?'Ausgang voll':D.rec.every(rc=>rc.plan&&!sp.plan[rc.plan])?'Pausiert (Plan aus)':'Wartet auf Material';return;}}
  const rc=D.rec[M.cur];
  if(f<.05){M.status='Keine Energie';return;}
  M.prog+=dt*uv('mspeed')*f*(sp.mm||1);M.status='Arbeitet';
  if(M.prog>=rc.t){M.in[rc.in]-=rc.n;if(M.in[rc.in]<1e-6)M.in[rc.in]=0;M.out[rc.out]=(M.out[rc.out]||0)+rc.k;M.cur=-1;M.prog=0;M.flash=1;
    sp.stats.value+=Math.max(0,MATS[rc.out].v*rc.k-MATS[rc.in].v*rc.n)*(sp.pv||1);
    if(rc.out==='barren')S.stats.barren+=rc.k;if(rc.out.endsWith('Brick'))S.stats.bricks+=rc.k;}
}

const TRV=[.9,1.1];
function stepTravel(dt){const F=travelFx;if(!F||!world)return;F.t+=Math.min(dt,.05);cam.gd=null;
  if(F.ph===0&&F.t>=TRV[0]){S.planet=F.pid;lastCell=-1;mapMode=false;buildWorld(F.pid);startCam();cam.alt=fitAlt(30);cam.gd=null;setMapMode(false);F.ph=1;F.t=0;updateHUD();}
  else if(F.ph===1&&F.t>=TRV[1]){world.position.set(0,0,0);travelFx=null;toast('Willkommen auf dem '+PLANETS[F.pid].name,'good');updateHUD();save();}}
/* runs after camUpdate: blends the normal camera into a view of the whole planet from afar, slides the planets, and back */
function travelCam(){const F=travelFx;if(!F||!world)return;const R=planetData(S.planet).R,k=Math.min(1,F.t/TRV[F.ph]);
  let far,b,slide;if(F.ph===0){far=smooth(0,.55,k);b=smooth(0,.3,k);slide=-smooth(.5,1,k);}else{far=1-smooth(.45,1,k);b=1-smooth(.7,1,k);slide=1-smooth(0,.5,k);}
  const np=camera.position.clone(),nq=camera.quaternion.clone(),dir=new THREE.Vector3(cam.d[0],cam.d[1],cam.d[2]).normalize();
  const dist=lerp(R+cam.alt,R*3.4,far),pos=dir.clone().multiplyScalar(dist),tgt=dir.clone().multiplyScalar(R*(1-far));
  camera.position.copy(pos);camera.up.set(cam.N[0],cam.N[1],cam.N[2]);camera.lookAt(tgt);const oq=camera.quaternion.clone();
  camera.position.copy(np.lerp(pos,b));camera.quaternion.copy(nq.slerp(oq,b));camera.updateMatrixWorld();
  const right=new THREE.Vector3(1,0,0).applyQuaternion(oq);world.position.copy(right).multiplyScalar(slide*R*1.9);}

  {const rs=sp.rigs||[],full=rs.filter(r=>sumObj(r.buf)>=RIG.buf-.5).length,high=rs.filter(r=>sumObj(r.buf)>=RIG.buf*.7).length;

      if(mi<64){const p=vsc(L.d,R+1);mpos[mi*3]=p[0];mpos[mi*3+1]=p[1];mpos[mi*3+2]=p[2];tmpC.setHex(0xffbf4d);mcol[mi*3]=tmpC.r;mcol[mi*3+1]=tmpC.g;mcol[mi*3+2]=tmpC.b;mi++;}}

  if(bvv0().rtg&&bvv0().rtg.glow)bvv0().rtg.glow.emissiveIntensity=.8+.4*Math.sin(t*2.2);

  for(const r of sp.rigs||[]){const rv=buildViews['r'+r.cell];if(!rv)continue;const cl=pd.cells[r.cell];
    if(r.busy){rv.drill.rotation.y+=dt*9;rv.drill.position.y=3.3-.35*(.5+.5*Math.sin(t*2.2+r.cell));rv.spark.emissiveIntensity=1.2+Math.sin(t*23+r.cell)*.6;if(!mapMode&&Math.random()<dt*14)emit3(cl.c,R+.4,DIRT[cl.type].light,1,1.6,1.6);}else rv.spark.emissiveIntensity=0;
    const f=Math.min(1,sumObj(r.buf)/RIG.buf),hh=Math.max(.02,f*2.4);rv.fill.scale.y=hh;rv.fill.position.y=.3+hh/2;rv.dockM.emissiveIntensity=r.claim!=null?.9:.15;
    rv.beacon.color.setHex(f>=.99?0xff6b5b:f>=.7?0xffbf4d:0x3fe58a);rv.beacon.emissive.setHex(f>=.99?0xff6b5b:f>=.7?0xffbf4d:0x3fe58a);rv.beacon.emissiveIntensity=Math.sin(t*3+r.cell)>.4?1.6:.35;}
  for(const o of sp.outposts){const ov=buildViews[o.key];if(!ov||!ov.fill)continue;const f=Math.min(1,sumObj(o.buf)/stBuf(o.key)),hh=Math.max(.02,f*2.9);ov.fill.scale.y=hh;ov.fill.position.y=.55+hh/2;
    ov.docks.forEach((m,k)=>{m.emissiveIntensity=k>=stDocks(o.key)?0:o.docks[k]?.9+.3*Math.sin(t*8):.15;});}
  if(bvv0().hangar&&bvv0().hangar.pads){const dn=sp.drones.filter(d=>d.mode==='idle'&&!d.busy).length;bvv0().hangar.pads.forEach((m,k)=>{m.emissiveIntensity=k<dn?.9:.2;});}
  mapMarkers.geometry.setDrawRange(0,mi);mapMarkers.geometry.attributes.position.needsUpdate=true;mapMarkers.geometry.attributes.color.needsUpdate=true;
  const cnt={};for(const m in itemMeshes)cnt[m]=0;
  for(const id in beltViews){const bvw=beltViews[id],b=bvw.b;if(sp.beltMoving&&!sp.jam[b.id]&&sp.belts[b.id].length)bvw.tex.offset.x-=beltSpeed()*Math.max(.25,sp.ef)*dt/1.2;
    if(mapMode)continue;
    for(const it of sp.belts[b.id]){const im=itemMeshes[it[1]];if(!im||cnt[it[1]]>=160)continue;surfMatrix(beltPoint(b,it[0]),R,b.h+.22,it[0]*.7,1,_m4);im.setMatrixAt(cnt[it[1]]++,_m4);}}
  for(const m in itemMeshes){itemMeshes[m].count=cnt[m];itemMeshes[m].instanceMatrix.needsUpdate=true;}
  const bvv=buildViews;
  if(bvv.roh&&bvv.roh.fills){const f=Math.min(1,rohSum(sp)/rohCap());for(const m of bvv.roh.fills){const hh=Math.max(.02,f*3.3);m.scale.y=hh;m.position.y=.6+hh/2;}}
  if(bvv.prod&&bvv.prod.fills){const f=Math.min(1,prodSum(sp)/prodCap());bvv.prod.fills.forEach((m,i)=>{m.visible=f>i/4+.01;});}
  for(const s of STATIONS)if(bvv[s]&&bvv[s].fill){const f=Math.min(1,sumObj(sp.st[s].buf)/stBuf(s));bvv[s].fill.scale.y=Math.max(.05,f*3);
    bvv[s].docks.forEach((m,k)=>{m.emissiveIntensity=k>=stDocks(s)?0:sp.st[s].docks[k]?.9+.3*Math.sin(t*8):.15;});}
  if(bvv.presse&&bvv.presse.piston){const M=sp.mach.presse,ph=M.cur>=0?(M.prog*3)%1:0;bvv.presse.piston.position.y=2.2-Math.max(0,Math.sin(ph*Math.PI));bvv.presse.plate.visible=M.cur>=0;if(M.flash){M.flash=0;emit3(basePlanDir(pd,BLD.presse.pos[0],BLD.presse.pos[1]),R+1.2,0xcfc3ad,6,1.6,1.5);}}
  if(bvv.schmelze&&bvv.schmelze.glow){const M=sp.mach.schmelze;bvv.schmelze.glow.emissiveIntensity=M.cur>=0?1.2+.6*Math.sin(t*9):.25;if(M.cur>=0&&Math.random()<dt*6)emit3(basePlanDir(pd,BLD.schmelze.pos[0]-.9,BLD.schmelze.pos[1]),R+5,0x8a8f99,1,.3,1.6);if(M.flash){M.flash=0;SFX.coin();}}
  if(bvv.raff&&bvv.raff.rings){const on=sp.mach.raff.cur>=0;bvv.raff.rings.forEach((r,i)=>{r.rotation.z+=dt*(on?2+i:.2);r.material.emissiveIntensity=on?.9:.2;});}
  if(bvv.energy&&bvv.energy.reactor)bvv.energy.reactor.emissiveIntensity=.3+1.1*(sp.energy/energyCap(sp))*(.8+.2*Math.sin(t*4));
  if(bvv.research&&bvv.research.dish){bvv.research.dish.rotation.y+=dt*(S.research.active?1.4:.25);bvv.research.lab.emissiveIntensity=S.research.active?.7+.3*Math.sin(t*5):.25;}
  const rk=bvv.sell&&bvv.sell.rocket;
  if(rk&&sp.rk>0){const u=clamp(1-sp.rk/rocketTime(),0,1),hgt=u<.5?Math.pow(u*2,2)*40:Math.pow(1-(u-.5)*2,2)*40;rk.body.position.y=.35+hgt;rk.flame.visible=u<.5||u>.85;rk.flame.scale.set(1,.8+Math.random()*.5,1);rk.t=-1;}
  else if(rk){if(sp.rocketDue>200&&rk.t<0){sp.rocketDue=0;rk.t=0;}
    if(rk.t<0){rk.body.position.y=.35;rk.flame.visible=false;}
    if(rk.t>=0){rk.t+=dt;const u=rk.t/2.6,hgt=u<.5?Math.pow(u*2,2)*30:Math.pow(1-(u-.5)*2,2)*30;rk.body.position.y=.35+hgt;rk.flame.visible=true;rk.flame.scale.set(1,.8+Math.random()*.5,1);if(u>=1){rk.t=-1;rk.body.position.y=.35;rk.flame.visible=false;}}}
  if(bv.earth)bv.earth.rotation.y+=dt*.02;
  if(buildViews.dome)buildViews.dome.g.visible=!!sp.shOn&&!mapMode;
  updParticles(dt);updMeteors(dt);updFloat(dt);
}
function setMapMode(on){mapMode=on;for(const c of chunks){c.mesh.visible=!on;c.mmesh.visible=on;}for(const ds of debrisSets)ds.im.visible=!on;if(W[S.planet])for(const a of W[S.planet].act.values())if(a.mesh)a.mesh.visible=!on;
  for(const m in itemMeshes)itemMeshes[m].visible=!on;if(mapMarkers)mapMarkers.visible=on;for(const id in beltViews)beltViews[id].grp.visible=!on;for(const[,vw]of vehViews)vw.g.visible=!on;
  if(on&&W[S.planet])repaintAll();
  $('#fabIco').innerHTML=on?ICO_HOME:ICO_GLOBE;$('#fabMap').setAttribute('aria-label',on?'Zur Basis':'Planetenkarte');if(S)updateHUD();if(world)updLocks();}

/* ===================== 13. Main loop + boot ===================== */
let last=performance.now(),lastWall=Date.now(),bgAcc=0,hudAcc=0,saveAcc=0,rateAcc=0,T0=0,sheetAcc=0,scrubLvl=0,lastValue=0;
function frame(now){
  requestAnimationFrame(frame);
  const wall=Date.now(),gap=(wall-lastWall)/1000;lastWall=wall;
  if(gap>5){const rep=runOffline(gap);if(rep)afterOffline(rep);last=now;}
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;T0+=dt;
  holdCheck(now);edgePan(dt);
  simStep(S.planet,dt,true);
  bgAcc+=dt;if(bgAcc>=1){for(const pid in S.planets)if(pid!==S.planet&&W[pid])simStep(pid,bgAcc,false);bgAcc=0;}
  researchTick(dt);
  updateVisuals(dt,T0);camUpdate(dt);travelCam();
  renderer.render(scene,camera);
  scrubLvl=lerp(scrubLvl,Math.min(1,strokeRem*25),1-Math.exp(-14*dt));strokeRem=0;scrub(stroke?scrubLvl:0,stroke&&stroke.sfx);
  if(stroke&&stroke.acc>=1&&T0-stroke.ft>.5&&stroke.ld){stroke.ft=T0;floatText3(stroke.ld,1.2,'+'+fmt(stroke.acc)+' '+MATS[stroke.mat||'staub'].name,'mat');stroke.acc-=Math.floor(stroke.acc);}
  S.stats.play=(S.stats.play||0)+dt;sampleRates(dt);
  hudAcc+=dt;if(hudAcc>.15){hudAcc=0;updateHUD();}
  sheetAcc+=dt;if(sheetAcc>.25){sheetAcc=0;refreshSheet();}
  rateAcc+=dt;if(rateAcc>=2){rateEMA=lerp(rateEMA,saleAcc/rateAcc,.35);const v=SP().stats.value;prodRate=lerp(prodRate,Math.max(0,v-lastValue)/rateAcc,.35);lastValue=v;saleAcc=0;rateAcc=0;}
  saveAcc+=dt;if(saveAcc>12){saveAcc=0;save();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();try{cloudPush(serialize(),true);}catch(e){}}});
window.addEventListener('pagehide',save);
function startCam(){const pd=planetData(S.planet),st=pd.cells[pd.start];cam.d=vnorm(vadd(vsc(st.c,.7),vsc(pd.cells[pd.base].c,.3)));cam.N=pd.cells[pd.base].e2.slice();camReproject();cam.alt=fitAlt(18);cam.gd=null;}
function migrate(){
  if((S.qv||1)<2){if(S.quest>=1)S.quest++;S.qv=2;}
  if(S.qv<3){if(S.quest>=6)S.quest++;S.qv=3;}
  if(Object.keys(S.done||{}).length&&!S.hintRig){S.hintRig=1;setTimeout(()=>{try{toast('Neu: Tiefenabbau! Auf komplett sauberen Planeten baust du jetzt Bohrtürme – Basis → Tiefenabbau','good');}catch(e){}},4500);}
  if(S.layout!==3){for(const pid in S.planets){const pd=planetData(pid),sp=S.planets[pid];if(!sp.owned.includes(pd.start))sp.owned.push(pd.start);
      for(const v of sp.veh){if(v.mode==='queue'||v.mode==='unload')v.mode='toUnload';v.sid=null;v.d=basePlanDir(pd,2.5,13);}for(const st of STATIONS)sp.st[st].docks=[];}
    S.layout=3;}
  if(!S.locMig){for(const pid in S.planets){const sp=S.planets[pid];sp.upg=sp.upg||{};for(const u of UPG)if(u.loc&&S.upg[u.id])sp.upg[u.id]=S.upg[u.id];}S.locMig=1;}
  if(!S.maxStage){S.maxStage=1;for(const pid in S.planets)S.maxStage=Math.max(S.maxStage,S.planets[pid].stage);}
  for(const pid in S.planets)grantAuto(S.planets[pid]);}
function adoptSave(b,msg){for(const k in W)delete W[k];S=b;migrate();for(const pid in S.planets)initRuntime(pid);
  const rep=runOffline((Date.now()-(S.lastActive||Date.now()))/1000);mapMode=false;buildWorld(S.planet);startCam();
  if(SP().stage>=2){cam.d=basePlanDir(planetData(S.planet),0,0);camReproject();cam.alt=fitAlt(36);}camApply();setMapMode(false);closeSheet();hideModal();updateHUD();
  lastWall=Date.now();last=performance.now();lastValue=SP().stats.value;if(rep)afterOffline(rep);else save();toast(msg,'good');}
function boot(){
  resize();
  const loaded=load();S=loaded||freshSave();bootFresh=!loaded;bootLocalT=loaded?(loaded.lastActive||0):0;
  migrate();
  for(const pid in S.planets)initRuntime(pid);
  let rep=null;if(loaded)rep=runOffline((Date.now()-(S.lastActive||Date.now()))/1000);
  buildWorld(S.planet);startCam();
  if(loaded&&SP().stage>=2){cam.d=basePlanDir(planetData(S.planet),0,0);camReproject();cam.alt=fitAlt(36);}

  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const L of lockPool)L.key='';try{if(world)rebuildBase();}catch(e){}});
  lastWall=Date.now();last=performance.now();lastValue=SP().stats.value;requestAnimationFrame(frame);
  if(!loaded)save();
  cloudInit();
}
try{boot();}catch(e){console.error(e);const l=$('#loading');if(l)l.textContent='Fehler beim Start: '+e.message;}
})();
